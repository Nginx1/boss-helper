name: Personal edition checks

on:
  push:
    branches: ['personal/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build from maintained sources
        run: node scripts/build.cjs
      - name: Offline regression checks
        run: node scripts/test.cjs
      - name: Verify tracked generated files
        run: git diff --exit-code
      - name: Build installation package
        run: node scripts/package.cjs
